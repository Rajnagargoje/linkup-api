name: Deploy LinkUp API to AWS Elastic Beanstalk

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590999018745:role/GitHubActions-LinkUp-Deploy
          aws-region: ap-south-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-south-1
          application-name: linkup-api
          environment-name: linkup-api-prod