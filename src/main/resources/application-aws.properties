spring.application.name=linkup-api
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.main.allow-circular-references=true

# Keep memory/thread usage small for an initial single-instance AWS deployment.
spring.main.lazy-initialization=true
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:2}

# PostgreSQL (Neon or another externally managed PostgreSQL database)
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=15000

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}

# Initial deployment only. Prefer versioned migrations before production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost}

# Cloudinary photo storage
app.upload.provider=cloudinary
app.upload.max-size-mb=${UPLOAD_MAX_SIZE_MB:5}
app.upload.dir=/tmp/linkup-unused-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Transactional email provider
app.mail.provider=brevo
app.mail.from=${MAIL_FROM}
app.otp.email.cooldown-seconds=${OTP_EMAIL_COOLDOWN_SECONDS:60}
app.otp.email.expiry-minutes=${OTP_EMAIL_EXPIRY_MINUTES:30}

# Firebase push
linkup.push.enabled=${LINKUP_PUSH_ENABLED:false}
linkup.push.project-id=${FIREBASE_PROJECT_ID:linkup-7898e}

# AWS/Elastic Beanstalk health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Do not expose API docs on the hosted test environment.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
