spring.application.name=linkup-api
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.main.allow-circular-references=true

spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.data.mongodb.uri=${MONGODB_URI}
# Initial test deployment only. Use versioned migrations before a production launch.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost}
app.upload.provider=cloudinary
app.upload.max-size-mb=5
app.upload.dir=/tmp/linkup-unused-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.mail.provider=resend
app.mail.from=${MAIL_FROM}
app.otp.email.cooldown-seconds=60
app.otp.email.expiry-minutes=30

linkup.push.enabled=${LINKUP_PUSH_ENABLED:false}
linkup.push.project-id=${FIREBASE_PROJECT_ID:linkup-7898e}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
