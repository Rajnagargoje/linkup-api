linkup.ai.enabled=${LINKUP_AI_ENABLED:false}
linkup.ai.api-key=${LINKUP_AI_API_KEY:}
linkup.ai.endpoint=${LINKUP_AI_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
linkup.ai.model=${LINKUP_AI_MODEL:}

linkup.ai.fallback-seconds=${LINKUP_AI_FALLBACK_SECONDS:15}
linkup.ai.timeout-seconds=${LINKUP_AI_TIMEOUT_SECONDS:25}
linkup.ai.max-concurrent=${LINKUP_AI_MAX_CONCURRENT:12}
linkup.ai.max-output-tokens=${LINKUP_AI_MAX_OUTPUT_TOKENS:220}

linkup.ai.daily-requests=${LINKUP_AI_DAILY_REQUESTS:500}
linkup.ai.user-daily-requests=${LINKUP_AI_USER_DAILY_REQUESTS:60}
linkup.ai.daily-budget-usd=${LINKUP_AI_DAILY_BUDGET_USD:2.00}
linkup.ai.input-usd-per-million=${LINKUP_AI_INPUT_USD_PER_MILLION:1.00}
linkup.ai.output-usd-per-million=${LINKUP_AI_OUTPUT_USD_PER_MILLION:2.00}