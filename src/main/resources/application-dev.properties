spring.application.name=linkup-api
spring.main.allow-circular-references=true
server.port=8081

# =========================================================
# DATABASE - DEVELOPMENT
# =========================================================

# Local MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatapp}

# Local PostgreSQL
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/LINKUP}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


# =========================================================
# JWT - DEVELOPMENT
# =========================================================

# Local fallback allowed only for development
jwt.secret=${JWT_SECRET:5367566859703373367639792F423F452848284D6251655468576D5A71347437}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}


# =========================================================
# CORS - DEVELOPMENT
# =========================================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,capacitor://localhost}


# =========================================================
# EMAIL - DEVELOPMENT
# =========================================================

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:no-reply@linkup.app}

app.otp.email.cooldown-seconds=${OTP_EMAIL_COOLDOWN_SECONDS:60}
app.otp.email.expiry-minutes=${OTP_EMAIL_EXPIRY_MINUTES:30}


# =========================================================
# PHOTO STORAGE - DEVELOPMENT
# =========================================================

app.upload.dir=${UPLOAD_DIR:uploads/photos}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8081/uploads/photos}
app.upload.max-size-mb=${UPLOAD_MAX_SIZE_MB:5}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# FIREBASE PUSH - DEVELOPMENT
# =========================================================

linkup.push.enabled=${LINKUP_PUSH_ENABLED:false}
linkup.push.project-id=${FIREBASE_PROJECT_ID:linkup-7898e}